services:
  onemenu:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:password@host.docker.internal:5432/onemenu
      PORT: "8080"
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
