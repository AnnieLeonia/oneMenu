name: Test Environment - Remove

on:
  pull_request:
    types: [closed]
    branches:
      - master

jobs:
  remove:
    uses: VictorWinberg/raspberry-pi-setup/.github/workflows/preview-remove.yml@main
    with:
      app: onemenu
    secrets:
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      KNOWN_HOSTS: ${{ secrets.KNOWN_HOSTS }}